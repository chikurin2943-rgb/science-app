<body>

  <!-- 共通ヘッダー -->

    <nav class="nav">
      <a href="index.html">ホーム</a>

<article class="card fade-in-up" data-grade="2">

    <img src="assets/image/chigaku-sakidori.png" alt="地学先取りプリント">

    <h3>地学先取りプリント</h3>

    <div class="card-actions">
      <!-- 直接記事ページへ誘導するボタン -->
      <a href="print-detail-chigaku.html" class="btn btn-primary">解説とPDFを見る →</a>
    </div>
  </div>
</article>

      <!-- 例：中1プリントを追加したい場合は data-grade="1" を指定して追加します -->
